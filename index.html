<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الدور والمحافظ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <main class="max-w-7xl mx-auto px-4 py-8">
    <section class="mb-6">
      <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-6">
        <div class="flex justify-between items-center">
          <div>
            <div class="text-sm text-slate-500">هدف المحفظة الإجمالي</div>
            <div id="portfolioTotal" class="text-3xl font-bold num mt-1">—</div>
          </div>
          <div>
            <span id="stageBadge" class="px-3 py-1 rounded-full text-xs bg-slate-100 ring-1 ring-slate-200">
              المرحلة: —
            </span>
          </div>
        </div>

        <div class="mt-4">
          <div class="flex justify-between text-xs text-slate-500 mb-1">
            <span>نسبة التحقيق</span>
            <span id="achPercent">0%</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-3">
            <div id="progressBar" class="bg-emerald-500 h-3 rounded-full" style="width:0%"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-6 overflow-x-auto">
      <table class="min-w-full text-sm text-right">
        <thead class="border-b bg-slate-50">
          <tr id="tableHead"></tr>
        </thead>
        <tbody id="tableBody" class="divide-y"></tbody>
      </table>
    </section>
  </main>

<script>
fetch('data.json')
  .then(res => res.json())
  .then(data => {
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');

    const headers = Object.keys(data[0]);
    headers.forEach(h => {
      const th = document.createElement('th');
      th.className = "px-3 py-2 font-medium text-slate-600 whitespace-nowrap";
      th.textContent = h;
      tableHead.appendChild(th);
    });

    let totalPortfolio = 0;
    let totalCoverage = 0;

    data.forEach(row => {
      const tr = document.createElement('tr');

      headers.forEach(h => {
        const td = document.createElement('td');
        td.className = "px-3 py-2 whitespace-nowrap num";
        td.textContent = row[h];
        tr.appendChild(td);
      });

      totalPortfolio += Number(row["هدف المحفظة"]);
      totalCoverage += Number(row["التغطية"]);
      tableBody.appendChild(tr);
    });

    const percent = ((totalCoverage / totalPortfolio) * 100).toFixed(1);

    document.getElementById('portfolioTotal').textContent =
      totalPortfolio.toLocaleString('ar-SA') + " ر.س";
    document.getElementById('achPercent').textContent = percent + "%";
    document.getElementById('progressBar').style.width = percent + "%";

    let stage = "الأولى";
    if (percent >= 75) stage = "الرابعة";
    else if (percent >= 50) stage = "الثالثة";
    else if (percent >= 25) stage = "الثانية";

    document.getElementById('stageBadge').textContent = "المرحلة: " + stage;
  });
</script>

</body>
</html>
